<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silvia Yulmaneli Moreno León</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141418;
      --accent: #c5a059;
      --text: #e1e1e6;
      --text-muted: #a0a0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Georgia', serif;
      line-height: 1.7;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 0;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: 2px;
      color: var(--text);
    }

    nav {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.8;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .bio-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 30px;
      margin: 30px 0;
      display: flex;
      gap: 30px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .bio-card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent);
    }

    .bio-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Elemento decorativo yul.jpeg con botón triangular */
    .decor-container {
      position: relative;
      display: inline-block;
      margin: 40px auto;
      text-align: center;
      width: 100%;
    }

    .decor-image {
      max-width: 250px;
      border-radius: 8px;
    }

    .btn-triangle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 25px solid var(--accent);
      cursor: pointer;
      background: none;
      border-right: none;
      transition: transform 0.2s;
    }

    .btn-triangle:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* MODAL DE GALERÍA (Estilo Instagram Story) */
    .gallery-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .gallery-modal.active {
      display: flex;
    }

    .story-carousel-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .story-progress-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .progress-segment {
      height: 2px;
      flex: 1;
      background-color: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-segment-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      transition: width 0.1s linear;
    }

    .progress-segment.active .progress-segment-fill {
      width: 100%;
    }

    .story-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg, 
        rgba(0,0,0,0.4) 0%, 
        rgba(0,0,0,0) 15%, 
        rgba(0,0,0,0) 85%, 
        rgba(0,0,0,0.5) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .story-slides {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-left, .nav-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 5;
      cursor: pointer;
    }

    .nav-left { left: 0; }
    .nav-right { right: 0; }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      z-index: 20;
      background: none;
      border: none;
      font-family: sans-serif;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Silvia Yulmaneli Moreno León</h1>
    <nav>
      <a href="#biografia">Biografía</a>
      <a href="#obras">Obras</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <div class="container">
    <section id="biografia" class="bio-card">
      <img src="yu.jpeg" alt="Yulmaneli Moreno León">
      <p>
        Semblanza y trayectoria de Silvia Yulmaneli Moreno León. Espacio de difusión de sus trabajos literarios, producciones y proyectos de creación artística.
      </p>
    </section>

    <!-- Elemento decorativo yul.jpeg con botón para abrir la galería -->
    <div class="decor-container" id="contacto">
      <img src="yul.jpeg" alt="Decorativo Yulma" class="decor-image">
      <button class="btn-triangle" onclick="openGallery()" title="Abrir Galería"></button>
    </div>
  </div>

  <!-- Modal Galería con Estilo Stories de Instagram -->
  <div class="gallery-modal" id="galleryModal">
    <div class="story-carousel-container" id="storyCarousel">
      <button class="close-btn" onclick="closeGallery()">&times;</button>
      
      <div class="story-progress-bar">
        <div class="progress-segment"><div class="progress-segment-fill"></div></div>
        <div class="progress-segment"><div class="progress-segment-fill"></div></div>
        <div class="progress-segment"><div class="progress-segment-fill"></div></div>
      </div>

      <div class="story-overlay"></div>

      <div class="nav-left" onclick="prevSlide()"></div>
      <div class="nav-right" onclick="nextSlide()"></div>

      <div class="story-slides">
        <div class="slide active">
          <img src="yu.jpeg" alt="Fotografía 1">
        </div>
        <div class="slide">
          <img src="Code_Generated_Image.jpg" alt="Fotografía 2">
        </div>
        <div class="slide">
          <img src="yul.jpeg" alt="Fotografía 3">
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; Silvia Yulmaneli Moreno León. Todos los derechos reservados.</p>
  </footer>

  <script>
    const modal = document.getElementById('galleryModal');
    const slides = document.querySelectorAll('#storyCarousel .slide');
    const segments = document.querySelectorAll('#storyCarousel .progress-segment');
    let currentIndex = 0;
    let timer = null;
    const slideDuration = 4000;

    function openGallery() {
      modal.classList.add('active');
      showSlide(0);
    }

    function closeGallery() {
      modal.classList.remove('active');
      if (timer) clearInterval(timer);
    }

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });

      segments.forEach((segment, i) => {
        const fill = segment.querySelector('.progress-segment-fill');
        if (i < index) {
          segment.classList.remove('active');
          fill.style.transition = 'none';
          fill.style.width = '100%';
        } else if (i === index) {
          segment.classList.add('active');
          fill.style.transition = 'none';
          fill.style.width = '0%';
          setTimeout(() => {
            fill.style.transition = `width ${slideDuration}ms linear`;
            fill.style.width = '100%';
          }, 20);
        } else {
          segment.classList.remove('active');
          fill.style.transition = 'none';
          fill.style.width = '0%';
        }
      });

      currentIndex = index;
      resetAutoPlay();
    }

    function nextSlide() {
      let nextIndex = (currentIndex + 1) % slides.length;
      showSlide(nextIndex);
    }

    function prevSlide() {
      let prevIndex = (currentIndex - 1 + slides.length) % slides.length;
      showSlide(prevIndex);
    }

    function resetAutoPlay() {
      if (timer) clearInterval(timer);
      timer = setInterval(nextSlide, slideDuration);
    }
  </script>
</body>
</html>
